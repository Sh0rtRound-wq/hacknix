#  ◈ WINDOW & LAYER RULES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ─────────────────────────────
# Layer rules (OSD / overlays)
# ─────────────────────────────
layerrule {
    name = volume-osd
    match:namespace = volume_osd
    animation = off
}

layerrule {
    name = brightness-osd
    match:namespace = brightness_osd
    animation = off
}

layerrule {
    name = hyprpicker
    match:namespace = hyprpicker
    animation = off
}

layerrule {
    name = qsdock
    match:namespace = qsdock
    animation = off
}

layerrule {
    name = session-lock
    match:namespace = ext-session-lock
    blur = on
    ignore_alpha = 0.2
}

# ─────────────────────────────
# Window rules
# ─────────────────────────────

# ───────── App Launcher ─────────
windowrule {
    name = app-launcher-rules
    match:title = ^(app-launcher)$
    float = on
    center = on
    size = 1200 600
    animation = slide
}

